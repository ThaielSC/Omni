[package]
name = "omni"
version = "1.0.0"
edition = "2024"
license = "MIT"
description = "A terminal UI for inspecting and managing packages across system and language package managers."
homepage = "https://github.com/ThaielSC/Omni"
repository = "https://github.com/ThaielSC/Omni"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
toml = "0.8"
fuzzy-matcher = "0.3"
walkdir = "2.5"
anyhow = "1.0"
thiserror = "2.0"
zeroize = "1"

[dev-dependencies]
tempfile = "3.16"
