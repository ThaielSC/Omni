[package]
name = "omni"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
tokio = { version = "1.53", features = ["full"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
fuzzy-matcher = "0.3"
walkdir = "2.5"
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3.16"
